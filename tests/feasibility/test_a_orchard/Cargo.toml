[package]
name = "test_a_orchard"
version = "0.1.0"
edition = "2021"

[dependencies]
blake2b_simd = "1.0.5"
hex = "0.4.3"
pasta_curves = { version = "0.5", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reddsa = "0.5.2"
orchard = { version = "=0.15.5", default-features = false, features = ["std", "unstable-frost"] }
incrementalmerkletree = "0.8.1"

[profile.release]
opt-level = 3
